version: 2

# Man pages and completion scripts are generated from the command tree itself,
# so they can never drift from the flags the binary actually has. They are
# written outside dist/, which goreleaser insists on owning.
before:
  hooks:
    # --date takes the man page header off the commit rather than the clock,
    # so rebuilding a tag produces the same archives.
    - go run ./cmd/tba docs man --dir manpages --date {{ .CommitDate }}
    - go run ./cmd/tba docs completions --dir completions

builds:
  - main: ./cmd/tba
    binary: tba
    env:
      - CGO_ENABLED=0
    # Build from the commit timestamp rather than the wall clock, so two builds
    # of the same tag produce byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/the-blue-alliance/tba-cli/internal/version.Version={{ .Version }}
      - -X github.com/the-blue-alliance/tba-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/the-blue-alliance/tba-cli/internal/version.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "tba_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - src: manpages/*
        dst: man
      - src: completions/*
        dst: completions

checksum:
  name_template: "checksums.txt"

# The Homebrew tap lives on TBA-owned infrastructure. A prerelease tag stops
# here (skip_upload: auto), so `brew install tba` only ever gets a real release.
#
# This is a cask rather than a formula: goreleaser deprecated `brews` in favour
# of `homebrew_casks`, which is also what Homebrew now wants for prebuilt
# binaries. `brew install the-blue-alliance/tap/tba` is the same command either
# way; casks are macOS-only, so Linux users take the release archive.
homebrew_casks:
  - repository:
      owner: the-blue-alliance
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/the-blue-alliance/tba-cli"
    description: "Command-line interface for The Blue Alliance API"
    commit_author:
      name: tba-release-bot
      email: tba-release-bot@users.noreply.github.com
    skip_upload: auto
    binaries:
      - tba
    # Shipped in the archive by the docs generator, so brew installs the same
    # pages and scripts the tarball has.
    manpages:
      - "man/*.1"
    completions:
      bash: completions/tba.bash
      zsh: completions/tba.zsh
      fish: completions/tba.fish
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tba"]
          end

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore\(deps\)'
      - '^ci'
      - '^test'
      - '^Merge branch'
      - '^Merge pull request'

release:
  footer: |
    ---

    **Installation.** See the [install instructions](https://github.com/the-blue-alliance/tba-cli#installation).
    Run `tba version` to check what you have.

announce:
  slack:
    enabled: true
    message_template: |
      Released *tba-cli* `{{ .Tag }}` :tada:
      https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/tag/{{ .Tag }}
    username: release-bot
    icon_emoji: ":tba:"
