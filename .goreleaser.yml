version: 2

builds:
  - main: ./cmd/tba
    binary: tba
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "tba_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

announce:
  slack:
    enabled: true
    message_template: |
      Released *tba-cli* `{{ .Tag }}` :tada:
      https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/tag/{{ .Tag }}
    username: release-bot
    icon_emoji: ":tba:"
