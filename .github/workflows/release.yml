name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One release at a time, and never cancel one: a half-finished release has
# already published artifacts. Two tags pushed together queue up instead.
#
# The group is fixed rather than keyed on the ref, because a ref-keyed group
# only serialises a tag against itself — which cannot happen — and let two
# different tags release side by side over the same repository.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
